<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      resizes-content: the on-screen keyboard shrinks the layout (and 100dvh) instead of only
      covering it, so full-height pages keep their bottom bar above the keyboard. viewport-fit=cover: in a browser tab the page
      draws behind the navigation bar (edge to edge) and colours it; layouts keep clear of it via --sab (app.css). An
      installed app gets no edge to edge: Chrome draws that bar itself (see the manifest in branding.rs).
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/branding/apple-touch-icon.png" />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
