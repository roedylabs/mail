packages:
  - apps/*
  - packages/*

# Lefthook needs no build script: "prepare" in the root package.json installs
# the hooks, the binary comes via optional dependencies.
allowBuilds:
  lefthook: false

# Only resolve versions that have been published for at least 7 days (in
# minutes), the same cooldown as Dependabot (.github/dependabot.yml): a
# hijacked release is usually found and pulled within that time. Explicitly
# set, the check is strict: a younger version fails the install instead of
# being added to minimumReleaseAgeExclude. An urgent security fix that is
# younger goes into minimumReleaseAgeExclude by hand (name@version).
minimumReleaseAge: 10080

# Security advisory GHSA-g3hv-75wg-m249:
# minimatch < 11.0.1 blows up glob patterns with optimizationLevel >= 2.
# There is no fixed 10.x; eslint, @eslint/config-array and
# @typescript-eslint/typescript-estree still require ^10.2. They only use
# new Minimatch(), Minimatch#match(), #pattern and minimatch() with the options
# dot and flipNegate, which 11 keeps unchanged (removed are makeRe, regexp,
# AST, debug). A range instead of a fixed version, so that lockfile updates
# pick up later fixes in 11.x. Remove once these packages require minimatch
# ^11.
overrides:
  minimatch@^10: ^11.0.4
