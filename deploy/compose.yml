# Roedy Mail with Docker Compose – a minimal production setup. A reverse
# proxy (Caddy, Traefik, nginx …) in front of 127.0.0.1:8080 terminates TLS.
#
#   docker compose -f deploy/compose.yml up -d
#   docker logs roedy-mail 2>&1 | grep Setup-Token    # token for the initial setup
#
# Settings come from environment variables or a .env file next to this file;
# deploy/.env.example is the template (all variables: docs/ops.md ›
# Configuration). Empty values count as unset.

name: roedy-mail

services:
  roedy-mail:
    # For predictable updates pin a version, e.g. ROEDY_IMAGE_TAG=0.1 in .env
    # (docs/ops.md › Updates).
    image: ghcr.io/roedylabs/mail:${ROEDY_IMAGE_TAG:-latest}
    container_name: roedy-mail
    restart: unless-stopped
    # User and group of the process; the image's default is 65532:65532. With
    # other IDs /data must belong to them: a bind mount for a new instance (see
    # volumes), a one-time chown for an existing volume (docs/ops.md ›
    # Container user). Never 0 (root).
    user: "${ROEDY_UID:-65532}:${ROEDY_GID:-65532}"
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      # Required for new instances: public address of the app, e.g.
      # https://mail.example.com (links in emails, OAuth redirect URI). Without
      # it the server does not start, unless the setup of an older version
      # stored an address (the server checks both).
      ROEDY_PUBLIC_URL: ${ROEDY_PUBLIC_URL:-}
      ROEDY_LOG: ${ROEDY_LOG:-}
      ROEDY_LOG_FORMAT: ${ROEDY_LOG_FORMAT:-}
      # The port is only open locally for the reverse proxy; without this
      # setting the server would only see the Docker gateway as the client IP.
      # The proxy must append X-Forwarded-For (Caddy, Traefik by themselves;
      # nginx: proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for).
      # Only when the variable is missing does true apply; set to empty means off.
      ROEDY_TRUST_PROXY: ${ROEDY_TRUST_PROXY-true}
      # If unset, the first start creates /data/secret.key (docs/ops.md ›
      # Instance key); ROEDY_SECRET_KEY_FILE e.g. for a Docker secret.
      ROEDY_SECRET_KEY: ${ROEDY_SECRET_KEY:-}
      ROEDY_SECRET_KEY_FILE: ${ROEDY_SECRET_KEY_FILE:-}
      # Optional: GeoIP database (MaxMind DB format) for the location in sessions
      # and security emails, e.g. /geoip/GeoLite2-City.mmdb with the volume
      # below. It is held in memory (docs/ops.md › Configuration).
      ROEDY_GEOIP_DB: ${ROEDY_GEOIP_DB:-}
    volumes:
      # Named volume: Docker takes owner 65532 from the image, so it only fits
      # the default ROEDY_UID/ROEDY_GID. With a bind mount the directory must
      # belong to ROEDY_UID:ROEDY_GID (default 65532:65532).
      - roedy-data:/data
      # - ./geoip:/geoip:ro
    # The image needs no privileges: only /data and /tmp are writable.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # The server finishes running requests within 8 s.
    stop_grace_period: 10s
    # Same check and timings as the image's HEALTHCHECK. `roedy-mail
    # healthcheck` sends GET /healthz to the port of ROEDY_LISTEN (default
    # 0.0.0.0:8080) over loopback, or to the address itself if it names one,
    # and exits 0 on 200. It runs with this container's user, environment and
    # restrictions and writes nothing. It shows that the process responds, not
    # that the database is readable (/readyz, docs/ops.md › Health). Exec form:
    # the image has no shell and no curl. start_interval needs Docker Engine 25
    # or later; delete that line on older engines. To turn the check off,
    # replace the keys below with `disable: true` alone; deleting the block
    # brings back the image's check.
    healthcheck:
      test: ["CMD", "roedy-mail", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      start_interval: 1s
      retries: 3

  # A reverse proxy in this file can wait until the server is healthy and
  # reach it at http://roedy-mail:8080:
  #
  # proxy:
  #   image: caddy:2
  #   depends_on:
  #     roedy-mail:
  #       condition: service_healthy

volumes:
  roedy-data:
