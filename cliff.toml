# git-cliff: CHANGELOG.md and release notes from the Conventional Commits on
# main (squash commits = PR titles). Run via `just release` or release.yml.
# https://git-cliff.org/docs/configuration

[changelog]
header = """
# Changelog

All notable changes to Roedy Mail are documented in this file. The format follows \
[Conventional Commits](https://www.conventionalcommits.org/en/); the entries \
are generated by [git-cliff](https://git-cliff.org) from the commits on `main`.\n
"""
body = """
{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}] – {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## Unreleased
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
{% if commit.breaking %}**[breaking]** {% endif %}\
{{ commit.message | split(pat="\n") | first | trim }}\
{% endfor %}
{% endfor %}\n
"""
trim = true
footer = ""
postprocessors = [
  # "(#30)" at the end of the squash commit → link to the PR
  { pattern = '\(#([0-9]+)\)', replace = "([#${1}](https://github.com/roedylabs/mail/pull/${1}))" },
]

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
# Section order via the invisible number comments.
commit_parsers = [
  { message = "^chore\\(release\\)", skip = true },
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Refactoring" },
  { message = "^docs", group = "<!-- 4 -->Documentation" },
  { message = "^test", group = "<!-- 5 -->Tests" },
  { message = "^(build|ci)", group = "<!-- 6 -->Build and CI" },
  { message = "^(chore|style)", group = "<!-- 7 -->Maintenance" },
  { message = "^revert", group = "<!-- 8 -->Reverted" },
]
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+.*"
sort_commits = "oldest"
