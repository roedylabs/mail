name: CI

# Lint, type check, tests and dependency policy of the web app and the server.
# "CI passed" is the single required check for these jobs (ruleset of main).
#
# Triggers: pull requests, merge queue, main, weekly (new Rust/Node versions,
# new advisories, warm cache on main) and manually.

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  schedule:
    - cron: "23 3 * * 1" # Mondays 03:23 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: ./.github/actions/setup-node

      - name: ESLint and Prettier
        run: pnpm lint

      # Linters as release binaries with pinned checksums, so that CI and
      # local runs use the same versions.
      - name: Install ShellCheck
        env:
          VERSION: 0.11.0
          SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          archive="$RUNNER_TEMP/shellcheck.tar.xz"
          curl -fsSL --retry 3 -o "$archive" "https://github.com/koalaman/shellcheck/releases/download/v${VERSION}/shellcheck-v${VERSION}.linux.x86_64.tar.xz"
          echo "${SHA256}  ${archive}" | sha256sum -c -
          tar -xJf "$archive" -C "$RUNNER_TEMP" --strip-components=1 "shellcheck-v${VERSION}/shellcheck"
          sudo install -m 0755 "$RUNNER_TEMP/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version
      - name: ShellCheck
        run: git ls-files -z '*.sh' | xargs -0 shellcheck

      - name: Install actionlint
        env:
          VERSION: 1.7.12
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSL --retry 3 -o "$archive" "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/actionlint_${VERSION}_linux_amd64.tar.gz"
          echo "${SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          sudo install -m 0755 "$RUNNER_TEMP/actionlint" /usr/local/bin/actionlint
          actionlint -version
      - name: actionlint
        run: actionlint -color

  web:
    name: Web app
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: ./.github/actions/setup-node

      - name: Type check
        run: pnpm check
      - name: Unit tests
        run: VITEST_MAX_WORKERS=$(($(nproc) + 1)) pnpm test
      - name: Build
        run: pnpm build
      # Keeps the app lightweight: JavaScript of the mailbox route ≤ 300 kB gzip.
      - name: JS budget of the mailbox route
        run: node scripts/js-budget.mjs

  server:
    name: Server
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          components: clippy, rustfmt

      # The `embed-web` feature embeds apps/web/build into the binary; a
      # placeholder page is enough to compile and test it without waiting
      # for the web build.
      - name: Placeholder web build
        run: |
          mkdir -p apps/web/build
          echo '<!doctype html><title>Roedy Mail</title>' >apps/web/build/index.html
      - name: rustfmt
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path fuzz/Cargo.toml -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --all-features --locked

  dependencies:
    name: Dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          cache: "false"
      - name: Set up Node.js
        uses: ./.github/actions/setup-node
      - name: Install cargo-deny and cargo-about
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-about@0.9.2,cargo-deny@0.20.2

      - name: Advisories, bans and sources (cargo deny)
        run: cargo deny --locked check advisories bans sources
      # License policy of the crates (about.toml); the same list ships in the image (Settings › About).
      - name: License list
        run: pnpm licenses:server

  # Single required status check for the ruleset of main: fails unless every
  # job above succeeded (also when one was skipped or cancelled).
  ci-ok:
    name: CI passed
    if: always()
    needs: [lint, web, server, dependencies]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: All jobs succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          {
            echo '| Job | Result |'
            echo '| --- | --- |'
            jq -r 'to_entries[] | "| \(.key) | \(.value.result) |"' <<<"$NEEDS"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          jq -e 'all(.[]; .result == "success")' <<<"$NEEDS" >/dev/null
