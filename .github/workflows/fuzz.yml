name: Fuzzing

# ClusterFuzzLite runs the cargo-fuzz targets in fuzz/ with libFuzzer and
# AddressSanitizer: for five minutes on pull requests that change Rust code
# (only the targets the change reaches) and for an hour every night, which
# also grows the corpus the pull requests start from. A crash fails the run
# and leaves the input as an artifact. The web app's renderer and parsers
# have property-based tests with fast-check in the normal test suite instead.
#
# Triggers: pull requests that change Rust code, nightly and manually.

on:
  pull_request:
    paths:
      - "crates/**"
      - "fuzz/**"
      - "Cargo.lock"
      - ".clusterfuzzlite/**"
      - ".github/workflows/fuzz.yml"
  schedule:
    - cron: "41 1 * * *" # daily 01:41 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fuzz:
    # Pull requests: code-change mode, 5 minutes. Otherwise: batch mode, 1 hour.
    name: Fuzz (${{ github.event_name == 'pull_request' && 'code change' || 'batch' }})
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ github.event_name == 'pull_request' && 45 || 90 }}
    permissions:
      contents: read
      actions: read # corpus and builds of earlier runs
    steps:
      - name: Build fuzz targets
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: rust
          github-token: ${{ secrets.GITHUB_TOKEN }}
          sanitizer: address
      - name: Run fuzz targets
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: ${{ github.event_name == 'pull_request' && 300 || 3600 }}
          mode: ${{ github.event_name == 'pull_request' && 'code-change' || 'batch' }}
          sanitizer: address
