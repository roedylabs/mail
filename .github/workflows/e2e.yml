name: E2E

# End-to-end suite (required check "E2E"): Playwright against the release
# binary with the embedded web app and a fresh Stalwart v1 server.
#
# Triggers: pull requests, merge queue, main, weekly and manually.

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  schedule:
    - cron: "47 4 * * 1" # Mondays 04:47 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  e2e:
    name: E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: ./.github/actions/setup-node
      - name: Set up Rust
        uses: ./.github/actions/setup-rust
      - name: Install Playwright browser
        run: pnpm --filter @roedy/web exec playwright install --with-deps --only-shell chromium
      - name: Install Stalwart v1 (release binary, verified checksum)
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/dev/stalwart.sh install

      - name: Suite
        run: scripts/e2e.sh

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report
          path: apps/web/test-results/
          retention-days: 7
          if-no-files-found: ignore
