name: CodeQL

# Static analysis of the workflows, the TypeScript and the Rust code with the
# security-and-quality queries; results go to the Security tab. Each language
# is a required check "Analyze (<language>)".
#
# Triggers: pull requests, main, weekly and manually.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "31 5 * * 2" # Tuesdays 05:31 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    # Code scanning needs GitHub Advanced Security in private repositories.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript, rust]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-and-quality
          # Test code uses fixed passwords and prints secrets in assertions on purpose.
          config: |
            paths-ignore:
              - crates/*/tests
              - "**/*.test.ts"
              - "**/*.test.mjs"
              - apps/web/e2e
      - name: Analyze
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
