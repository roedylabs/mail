version: 2

# Weekly grouped minor and patch updates per ecosystem; major updates arrive as
# separate pull requests so that one breaking release does not block the rest.
# A cooldown lets fresh releases settle before they are proposed.
updates:
  - package-ecosystem: cargo
    # fuzz/ has a lock file of its own (outside the workspace).
    directories: ["/", "/fuzz"]
    schedule:
      interval: weekly
    # Room for separate major-update PRs next to the grouped minor/patch PR.
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    commit-message:
      prefix: build(deps)
    groups:
      cargo:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Room for separate major-update PRs next to the grouped minor/patch PR.
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    commit-message:
      prefix: build(deps)
    ignore:
      # TypeScript majors need coordinated tooling updates.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      npm:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Room for separate major-update PRs next to the grouped minor/patch PR.
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci(deps)
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: docker
    # .clusterfuzzlite/: build image of the fuzz targets.
    directories: ["/", "/.clusterfuzzlite"]
    schedule:
      interval: weekly
    # Room for separate major-update PRs next to the grouped minor/patch PR.
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    commit-message:
      prefix: build(deps)
    groups:
      docker:
        patterns: ["*"]
        update-types: ["minor", "patch"]
